[env:esp32-c3-devkitm-1]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
board_build.flash_mode = dio 
framework = arduino
lib_deps = 
    bodmer/TFT_eSPI@^2.5.42

[platformio]
description = esp32-C3 round display (black bezel) tft_eSPI color demo